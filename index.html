<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 实时预览器 · 左侧编辑右侧渲染</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--acc:#33ff8a;--bg:#0e0e11;--card:#141418;--line:#232329;--text:#eee;--dim:#8a8a96}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.16em;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px 3px var(--acc)}
  .sub{font-size:19px;font-weight:200}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid #33333d;background:#1b1b21;color:#ddd;font:inherit;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;transition:.22s;white-space:nowrap}
  .btn:hover{border-color:#4a4a56;background:#22222a}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#0e0e11;font-weight:600}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  @media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .pane{display:flex;flex-direction:column;min-height:0}
  .pane+.pane{border-left:1px solid var(--line)}
  @media(max-width:820px){.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
  .ptitle{font-size:10.5px;letter-spacing:.2em;color:var(--dim);padding:10px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .ptitle b{font-weight:600}
  textarea{flex:1;resize:none;border:0;outline:none;background:transparent;color:#d8d8de;
    font:13.5px/1.75 "JetBrains Mono","Cascadia Code",Consolas,monospace;padding:18px 20px;min-height:0}
  #pv{flex:1;overflow:auto;padding:18px 24px 40px;min-height:0;font-size:14.5px;line-height:1.8;color:#d6d6de}
  /* ---------- 渲染样式 ---------- */
  #pv h1,#pv h2,#pv h3,#pv h4{border-bottom:1px solid #26262e;padding-bottom:.35em;margin:1.4em 0 .6em;font-weight:600;line-height:1.35}
  #pv h1{font-size:1.7em}#pv h2{font-size:1.4em}#pv h3{font-size:1.2em}#pv h4{font-size:1.05em}
  #pv p{margin:.65em 0}
  #pv code{background:#1c1c24;border:1px solid #2a2a34;border-radius:6px;padding:.14em .4em;font:12.5px/1.5 Consolas,monospace;color:var(--acc)}
  #pv pre{background:#0b0b0e;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;margin:1em 0}
  #pv pre code{background:none;border:0;padding:0;display:block;color:#d8d8de}
  #pv a{color:#7ec8ff;text-decoration:none}#pv a:hover{text-decoration:underline}
  #pv blockquote{border-left:3px solid var(--acc);background:rgba(51,255,138,.05);padding:2px 16px;margin:1em 0;color:var(--dim)}
  #pv ul,#pv ol{margin:.6em 0;padding-left:1.6em}
  #pv li{margin:.25em 0}
  #pv table{border-collapse:collapse;margin:1em 0;font-size:13.5px;display:block;overflow-x:auto}
  #pv th,#pv td{border:1px solid #2c2c36;padding:7px 14px;text-align:left}
  #pv th{background:#1b1b21}
  #pv hr{border:0;border-top:1px solid #2c2c36;margin:1.6em 0}
  #pv img{max-width:100%;border-radius:10px}
  #pv s{color:var(--dim)}
  footer{padding:10px 26px;border-top:1px solid var(--line);font-size:11.5px;color:#4c4c56;letter-spacing:.1em;display:flex;justify-content:space-between}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(80px);background:#fff;color:#0e0e11;
    font-size:13px;font-weight:600;padding:10px 20px;border-radius:99px;transition:.3s;opacity:0;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> MARKDOWN 预览器</div>
  <div class="sub">左侧编辑 · 右侧实时渲染</div>
  <div class="tools">
    <button class="btn" data-ins="h">标题</button>
    <button class="btn" data-ins="b">加粗</button>
    <button class="btn" data-ins="i">斜体</button>
    <button class="btn" data-ins="c">行内代码</button>
    <button class="btn" data-ins="q">引用</button>
    <button class="btn" data-ins="l">链接</button>
    <button class="btn" data-ins="ul">列表</button>
    <button class="btn" data-ins="t">表格</button>
    <button class="btn" id="btn-sample">示例</button>
    <button class="btn" id="btn-html">复制 HTML</button>
    <button class="btn" id="btn-md">下载 .md</button>
    <button class="btn acc" id="btn-clear">清空</button>
  </div>
</header>

<main>
  <section class="pane">
    <div class="ptitle"><b>MARKDOWN 输入</b></div>
    <textarea id="ta" spellcheck="false" placeholder="# 在这里写 Markdown...&#10;&#10;支持：标题、加粗、斜体、代码块、引用、列表、表格、链接、图片、分割线&#10;输入即渲染，内容自动保存在本地浏览器。"></textarea>
  </section>
  <section class="pane">
    <div class="ptitle"><b>渲染预览</b><span id="stat"></span></div>
    <div id="pv"></div>
  </section>
</main>

<footer><span>单个 HTML 文件 · 无框架 · 无外部请求 · 双击即可打开</span><span id="cnt">0 字 · 0 行</span></footer>
<div class="toast" id="toast"></div>

<script>
const ta=$('#ta'),pv=$('#pv');
function $(s){return document.querySelector(s)}
const toast=$('#toast');let tt;
function tip(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1600)}
async function copy(t){try{await navigator.clipboard.writeText(t);tip('已复制到剪贴板')}catch(e){prompt('复制失败，请手动复制：',t)}}

/* ---------- Markdown 解析 ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(t){
  const codes=[];
  t=esc(t).replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return ''+(codes.length-1)+''});
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
      .replace(/~~([^~]+)~~/g,'<s>$1</s>')
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  return t.replace(/(\d+)/g,(m,i)=>'<code>'+codes[+i]+'</code>');
}
function parse(md){
  const lines=md.replace(/\r\n?/g,'\n').split('\n');
  const out=[];let i=0;
  const pushBlock=t=>{if(t.trim()!=='')out.push(t)};
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*```/.test(l)){ /* 代码块 */
      const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i]))buf.push(lines[i++]);
      i++;
      pushBlock(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);continue;
    }
    if(/^#{1,6}\s+/.test(l)){const n=l.match(/^(#{1,6})\s+/)[1].length;
      pushBlock(`<h${n}>${inline(l.replace(/^#{1,6}\s+/,''))}</h${n}>`);i++;continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(l)){pushBlock('<hr>');i++;continue;}
    if(/^>\s?/.test(l)){ /* 引用 */
      const buf=[];while(i<lines.length&&/^>\s?/.test(lines[i]))buf.push(lines[i++].replace(/^>\s?/,''));
      pushBlock(`<blockquote>${inline(buf.join('\n'))}</blockquote>`);continue;}
    if(/^\s*[-*+]\s+/.test(l)){ /* 无序列表 */
      const buf=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*[-*+]\s+/,''));
      pushBlock(`<ul>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`);continue;}
    if(/^\s*\d+\.\s+/.test(l)){ /* 有序列表 */
      const buf=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))buf.push(lines[i++].replace(/^\s*\d+\.\s+/,''));
      pushBlock(`<ol>${buf.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`);continue;}
    if(l.includes('|')&&l.split('|').filter(Boolean).length>=2){ /* 表格（先预读确认结构，避免死循环） */
      const rows=[];let k=i;
      while(k<lines.length&&lines[k].includes('|'))rows.push(lines[k++]);
      const isSep=r=>/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(r);
      if(rows.length>=2&&isSep(rows[1])){
        i=k;
        const heads=rows[0].split('|').map(x=>x.trim()).filter(Boolean);
        const body=rows.slice(2).map(r=>r.split('|').map(x=>x.trim()).filter(Boolean));
        pushBlock(`<table><thead><tr>${heads.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead>`+
          `<tbody>${body.map(r=>`<tr>${heads.map((_,k)=>`<td>${inline(r[k]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        continue;
      }
      /* 不是有效表格 → 交给段落处理 */
    }
    if(lines[i].trim()===''){i++;continue;} /* 空行直接跳过 */
    /* 普通段落（碰到列表/引用/分割线等则停） */
    const isBlockStart=l=>/^\s*```/.test(l)||/^#{1,6}\s+/.test(l)||/^\s*([-*_])\1{2,}\s*$/.test(l)
      ||/^\s*[-*+]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)||/^>\s?/.test(l);
    const buf=[];while(i<lines.length&&lines[i].trim()!==''&&!isBlockStart(lines[i]))buf.push(lines[i++]);
    if(buf.length)pushBlock(`<p>${inline(buf.join('\n'))}</p>`);
  }
  return out.join('\n');
}

/* ---------- 渲染 ---------- */
function render(){
  const md=ta.value;
  pv.innerHTML=parse(md)||'<p style="color:#4c4c56">预览区</p>';
  const chars=md.replace(/\s/g,'').length,lines=md.split('\n').length;
  $('#cnt').textContent=`${chars} 字 · ${lines} 行`;
  localStorage.setItem('md_tool_content',md);
}
ta.addEventListener('input',render);

/* ---------- 工具栏插入 ---------- */
function ins(before,after,ph){
  const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e)||ph;
  ta.value=ta.value.slice(0,s)+before+sel+after+ta.value.slice(e);
  ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
  ta.focus();render();
}
const INS={
  h:['### ','\n','标题'],
  b:['**','**','加粗文字'],
  i:['*','*','斜体文字'],
  c:['`','`','code'],
  q:['> ','\n','引用内容'],
  l:['[','](https://example.com)','链接文字'],
  ul:['- ','\n','列表项'],
  t:['\n| 列A | 列B |\n| --- | --- |\n| 1 | 2 |\n','',''],
};
document.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{
  const [a,af,ph]=INS[b.dataset.ins];ins(a,af,ph);
});

/* ---------- 示例 / 复制 / 下载 / 清空 ---------- */
$('#btn-sample').onclick=()=>{
  ta.value=`# Markdown 实时预览器\n\n这是一个**轻量级** Markdown 渲染器，支持常用语法：\n\n## 基础格式\n\n- **加粗**、*斜体*、~~删除线~~、\`行内代码\`\n- 链接：[GitHub](https://github.com) 与图片：![示例图](https://picsum.photos/400/160)\n\n> 引用：好用的工具不需要框架，双击打开就能用。\n\n## 代码块\n\n\`\`\`js\nfunction greet(name){\n  return \`你好，\${name}!\`;\n}\nconsole.log(greet('开发者'));\n\`\`\`\n\n## 表格\n\n| 语法 | 支持 |\n| --- | --- |\n| 标题 / 列表 | ✅ |\n| 表格 / 引用 | ✅ |\n| 代码块 | ✅ |\n\n---\n\n内容自动保存在浏览器本地，刷新不丢失。`;
  render();
};
$('#btn-html').onclick=()=>copy(pv.innerHTML);
$('#btn-md').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ta.value],{type:'text/markdown'}));
  a.download='document.md';a.click();URL.revokeObjectURL(a.href);
  tip('已下载 document.md');
};
$('#btn-clear').onclick=()=>{ta.value='';render();tip('已清空')};

/* ---------- 初始化 ---------- */
ta.value=localStorage.getItem('md_tool_content')||'';
render();
</script>
</body>
</html>
